<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 52" fill="none" role="img" aria-label="تربات لنقل البضائع">
  <!-- أيقونة الشاحنة -->
  <g transform="translate(4, 8)">
    <!-- هيكل الشاحنة الرئيسي -->
    <rect x="0" y="6" width="28" height="18" rx="2" fill="#C9A84C" opacity="0.15" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- مقدمة الشاحنة -->
    <path d="M28 12 L28 24 L38 24 L38 18 L34 12 Z" fill="#C9A84C" opacity="0.15" stroke="#C9A84C" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- نافذة المقدمة -->
    <path d="M29.5 13 L29.5 17 L36 17 L33 13 Z" fill="#C9A84C" opacity="0.4"/>
    <!-- عجلات -->
    <circle cx="8" cy="25" r="3.5" fill="#C9A84C"/>
    <circle cx="8" cy="25" r="1.5" fill="#0D0D0D"/>
    <circle cx="31" cy="25" r="3.5" fill="#C9A84C"/>
    <circle cx="31" cy="25" r="1.5" fill="#0D0D0D"/>
    <!-- خطوط الباب -->
    <line x1="20" y1="6" x2="20" y2="24" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- نص تربات -->
  <text
    x="54"
    y="34"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="22"
    font-weight="700"
    fill="#C9A84C"
    letter-spacing="-0.5"
  >تربات</text>
  <!-- خط فاصل ذهبي -->
  <line x1="54" y1="38" x2="172" y2="38" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  <!-- نص فرعي -->
  <text
    x="54"
    y="47"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="9"
    fill="#C9A84C"
    opacity="0.7"
    letter-spacing="0.5"
  >لنقل البضائع — الكويت</text>
</svg>
